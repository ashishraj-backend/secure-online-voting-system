version: '3.8'
services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: voting
      MYSQL_ROOT_PASSWORD: password
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - '3306:3306'
    volumes:
      - db_data:/var/lib/mysql

  redis:
    image: redis:7
    ports:
      - '6379:6379'

  backend:
    build: .
    working_dir: /app
    ports:
      - '8080:8080'
    environment:
      JDBC_URL: jdbc:mysql://db:3306/voting?useSSL=false&allowPublicKeyRetrieval=true
      DB_USER: user
      DB_PASSWORD: password
      REDIS_HOST: redis
      JWT_SECRET: change_me_securely
    depends_on:
      - db
      - redis
  frontend:
    build: ./frontend
    ports:
      - '3000:3000'
    environment:
      - PORT=3000
    depends_on:
      - backend

volumes:
  db_data:

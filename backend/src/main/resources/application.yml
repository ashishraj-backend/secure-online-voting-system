spring:
  datasource:
    url: ${JDBC_URL:jdbc:mysql://localhost:3306/voting?useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: false
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}

spring:
  cache:
    type: redis


server:
  port: ${SERVER_PORT:8080}

jwt:
  secret: ${JWT_SECRET:change_this_in_env}
  expiration-ms: ${JWT_EXP_MS:3600000}

spring:
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
